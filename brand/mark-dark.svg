<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Exit Cost: two cost lines crossing on a measured axis.
       Ticks rather than numerals — digits are illegible below 48px while ticks
       still read as measurement. Square caps on the axis, rounded on the data
       lines, so the crossing reads clean rather than blocky.
       No frame here. This variant is circle-cropped for avatars, and a border
       slices visibly through the crop. Use mark-framed.svg where it sits in a
       square. -->
  <rect width="512" height="512" fill="#14161a"/>

  <g stroke="#565c66" stroke-linecap="butt" fill="none">
    <path d="M152 128 L152 368 L392 368" stroke-width="20"/>
    <g stroke-width="18">
      <path d="M120 168 H152 M120 248 H152 M120 328 H152"/>
      <path d="M216 400 V368 M288 400 V368 M360 400 V368"/>
    </g>
  </g>

  <!-- Rounded caps on the data lines only. Square ends meeting at the crossing
       read as a hard corner; rounded ones let the two lines pass through each
       other cleanly. The axis keeps square ends — an axis is a rule, not a stroke. -->
  <g fill="none" stroke-linecap="round">
    <path d="M152 368 L378 146" stroke="#e8737a" stroke-width="44"/>
    <path d="M152 256 L378 208" stroke="#57c295" stroke-width="44"/>
  </g>
</svg>
