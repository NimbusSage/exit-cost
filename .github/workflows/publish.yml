name: Refresh and publish

# The machine runs on GitHub's infrastructure rather than any one box, so it
# keeps publishing whether or not the workstation that built it is switched on.
on:
  schedule:
    - cron: '17 5 * * *'      # nightly, 05:17 UTC
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write             # to commit refreshed prices back as the audit trail
  pages: write
  id-token: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - name: Test
        run: npm test

      - name: Refresh live pricing
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HETZNER_API_TOKEN: ${{ secrets.HETZNER_API_TOKEN }}
          DO_API_TOKEN: ${{ secrets.DO_API_TOKEN }}
        run: node pipeline/collect/index.js

      - name: Build page models
        run: node pipeline/render/build.js

      - name: Preflight
        run: node ops/verify.js

      - name: Build site
        env:
          SITE_URL: ${{ vars.SITE_URL || 'https://nimbussage.github.io/exit-cost' }}
        run: node site/build.js

      - name: Commit refreshed prices
        run: |
          git config user.name  "exit-cost-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "no price changes today"
          else
            git commit -m "chore(data): nightly price refresh $(date -u +%F)"
            git push
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
